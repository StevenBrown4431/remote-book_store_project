{% extends "base.html" %}

{% block title %}Our Books - AceReads{% endblock %}

{% block content %}
<main>
    <h2 class="page-title">Our Books</h2>
    <p class="page-subtitle">Here's what we have:</p>

    <!-- 4-Column Book Grid -->
    <ul class="book-list">
        {% for book in books %}
            <li class="book-card">
                <div class="cover-container">
                    <img
                        src="{{ url_for('static', filename='images/book_' ~ book.id ~ '.jpg') }}"
                        alt="{{ book.title }}"
                        class="book-thumb"
                        onerror="this.style.display='none';"
                    >
                    <div class="fallback-cover">
                        <span class="fallback-title">{{ book.title }}</span>
                        <span class="fallback-author">{{ book.author }}</span>
                    </div>
                </div>

                <div class="book-info">
                    <strong>{{ book.title }}</strong> by {{ book.author }}
                </div>
            </li>
        {% endfor %}
    </ul>

    <h2>Add a new book:</h2>
    <form method="POST" action="/books">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Title" required><br>

        <label for="author">Author</label>
        <input type="text" id="author" name="author" placeholder="Author" required><br>

        <input type="submit" value="Submit">
    </form>
</main>
{% endblock %}
