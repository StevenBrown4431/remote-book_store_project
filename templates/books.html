<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <meta charset="UTF-8">
        <title>AceReads</title>
    </head>
    
    <body>
        <header>
            <nav>
            <ul>
                <li><a href="/books">Books</a></li>
                <li><a href="/authors">Our Authors</a></li>
                <li><a href="/team">Sign up</a></li>
                <li><a href="/login">Login</a></li>
                <li><a href="/quotes">Quotes</a></li>
            </ul>
        </nav>
            <h1>Our Books</h1>
            <p> Here's what we have:</p>
        </header>

    <main>
        <!-- 4-Column Book Grid -->
        <ul class="book-list">
            {% for book in books %}
                <li class="book-card">
                    <div class="cover-container">
                        <img
                            src="{{ url_for('static', filename='images/book_' ~ book.id ~ '.jpg') }}"
                            alt="{{ book.title }}"
                            class="book-thumb"
                            onerror="this.style.display='none';"
                        >
                        <div class="fallback-cover">
                            <span class="fallback-title">{{ book.title }}</span>
                            <span class="fallback-author">{{ book.author }}</span>
                        </div>
                    </div>

                    <div class="book-info">
                        <strong>{{ book.title }}</strong> by {{ book.author }}                
                    </div>
                </li>
            {% endfor %}
        </ul>

        <h2>Add a new book:</h3>
        <form method="POST" action="/books">
            <label for="title">Title</label>
            <input type="text" name="title" placeholder="Title" required><br>
            <label for="author">Author</label>
            <input type="text" name="author"placeholder="Author" required><br>
            <input type="submit" value="Submit">
        </form>
    </main>

        
        <footer>
            <p>&copy; 2026 AceReads. All rights reserved.</p>
        </footer>

    </body>
</html>
