{% extends "base.html" %}

{% block title %}Our Books - AceReads{% endblock %}

{% block content %}
<main>
    <h2 class="page-title">Our Books</h2>
    <p class="page-subtitle">Here's what we have:</p>

    <!-- 4-Column Book Grid -->
    <ul class="book-list">
        {% for book in books %}
            <li class="book-card">
                <a href="{{ url_for('get_individual_book', book_id=book.id) }}" class="book-card-link">
                    <div class="cover-container">
                        <img
                            src="{{ book.image_url }}"
                            alt="{{ book.title }}"
                            class="book-thumb"
                            onerror="this.style.display='none';"
                        >
                        <div class="fallback-cover">
                            <span class="fallback-title">{{ book.title }}</span>
                            <span class="fallback-author">{{ book.author }}</span>
                        </div>
                    </div>

                    <div class="book-info">
                        <strong>{{ book.title }}</strong> by {{ book.author }}
                    </div>
                </a>
            </li>
        {% endfor %}
    </ul>
</main>
{% endblock %}
