{% extends "base.html" %}

{% block title %}Add Book - AceReads{% endblock %}

{% block content %}
<main>
    <h2 class="page-title">Add a book</h2>
    <p class="page-subtitle">Fill in the form below:</p>
    
    <form method="POST" action="/books/add" novalidate>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Title" required><br>

        <label for="author">Author</label>
        <input type="text" id="author" name="author" placeholder="Author" required><br>

        <label for="synopsis">Synopsis</label>
        <input type="text" id="synopsis" name="synopsis" placeholder="Synopsis"><br>

        <label for="rating">Rating out of 10</label>
        <input type="number" id="rating" name="rating" min="1" max= "10" placeholder="Rating"><br>

        <label for="image_url">Image URL</label>
        <input type="url" id="image_url" name="image_url" placeholder="https://example.com/cover.jpg"><br>

        <label for="notes">Notes</label>
        <input type="text" id="notes" name="notes" placeholder="Notes"><br>

        <button type="submit">Submit</button>
    </form>
</main>
{% endblock %}
