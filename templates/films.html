{% extends "base.html" %}

{% block title %}Our Films - AceReads{% endblock %}

{% block content %}
<main>
    <h2 class="page-title">Our Films</h2>
    <p class="page-subtitle">Here's what we have:</p>
                <!-- 4-Column film Grid -->
                <ul class="film-list">
                    {% for film in films %}
                        <li class="film-card">
                            <div class="cover-container">
                                <img
                                    src="{{ url_for('static', filename='images/film_' ~ film.id ~ '.jpg') }}"
                                    alt="{{ film.title }}"
                                    class="film-thumb"
                                    onerror="this.style.display='none';"
                                >
                                <div class="fallback-cover">
                                    <span class="fallback-title">{{ film.title }}</span>
                                    <span class="fallback-release_year">{{ film.release_year }}</span>
                                </div>
                            </div>

                            <div class="film-info">
                                <strong>{{ film.title }}</strong>  ({{ film.release_year }})                
                            </div>
                        </li>
                    {% endfor %}
                </ul>
            </main>        
{% endblock %}
