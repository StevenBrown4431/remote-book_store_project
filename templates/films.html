{% extends "base.html" %}

{% block title %}Our Films - AceReads{% endblock %}

{% block content %}
<main>
    <h2 class="page-title">Our Films</h2>
    <p class="page-subtitle">Here's what we have:</p>
                <!-- 4-Column film Grid -->
                <ul class="film-list">
                    {% for film in films %}
                        <li class="film-card">
                            <div class="cover-container">
                                <img
                                    src="{{ url_for('static', filename='images/film_' ~ film.id ~ '.jpg') }}"
                                    alt="{{ film.title }}"
                                    class="film-thumb"
                                    onerror="this.style.display='none';"
                                >
                                <div class="fallback-cover">
                                    <span class="fallback-title">{{ film.title }}</span>
                                    <span class="fallback-release_year">{{ film.release_year }}</span>
                                </div>
                            </div>

                            <div class="film-info">
                                <strong>{{ film.title }}</strong>  ({{ film.release_year }})                
                            </div>
                        </li>
                    {% endfor %}
                </ul>
                <!-- In-page Film Creation Form -->
                <form method="POST" action="/films">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="Title" required>

                    <label for="release_year">Release Year</label>
                    <input type="number" id="release_year" name="release_year" placeholder="Release Year" required>

                    <button type="submit">Add Film</button>
                </form>
            </main>        
{% endblock %}
